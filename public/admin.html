<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم - أكلات ماما</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma; background: #0a0a0a; color: white; min-height: 100vh; }
        
        .header { background: linear-gradient(135deg, #1a0505, #0a0a0a); padding: 20px; text-align: center; border-bottom: 3px solid #ff6b35; }
        .header h1 { color: #ff6b35; font-size: 2em; }
        
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        
        .login-box { background: #1a1a1a; border-radius: 20px; padding: 30px; max-width: 400px; margin: 50px auto; }
        .login-box h2 { color: #ff6b35; text-align: center; margin-bottom: 20px; }
        
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #ff6b35; border-radius: 10px; background: #0a0a0a; color: white; font-size: 1em; }
        input::placeholder { color: #777; }
        
        button { background: #ff6b35; color: white; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1em; }
        button:hover { background: #e55a2b; }
        
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: #1a1a1a; border-radius: 15px; padding: 20px; text-align: center; border: 1px solid #2d2d2d; }
        .stat-card h3 { color: #ff6b35; font-size: 2em; margin-bottom: 5px; }
        .stat-card p { color: #888; }
        
        .section { background: #1a1a1a; border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 1px solid #2d2d2d; }
        .section h2 { color: #ff6b35; margin-bottom: 15px; }
        
        .table-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
        .table-card { background: #0a0a0a; border-radius: 10px; padding: 15px; text-align: center; border: 1px solid #2d2d2d; cursor: pointer; }
        .table-card:hover { border-color: #ff6b35; }
        .table-card h4 { color: white; margin-bottom: 5px; }
        .table-card p { color: #888; font-size: 0.8em; }
        
        .menu-item-admin { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #0a0a0a; border-radius: 10px; margin-bottom: 8px; }
        .menu-item-admin button { background: #f44336; padding: 5px 10px; font-size: 0.8em; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; overflow-x: auto; }
        .tab { padding: 10px 15px; background: #1a1a1a; border-radius: 10px; cursor: pointer; white-space: nowrap; color: #888; }
        .tab.active { background: #ff6b35; color: white; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; z-index: 1000; padding: 20px; }
        .modal-content { background: #1a1a1a; border-radius: 20px; padding: 25px; max-width: 500px; margin: 30px auto; }
        .modal-content h2 { color: #ff6b35; margin-bottom: 15px; text-align: center; }
        
        @media (max-width: 600px) {
            .dashboard { grid-template-columns: 1fr 1fr; }
            .table-list { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>👩‍🍳 لوحة تحكم - أكلات ماما</h1>
    </div>
    
    <div class="container">
        <!-- شاشة تسجيل الدخول -->
        <div id="login-screen">
            <div class="login-box">
                <h2>تسجيل الدخول</h2>
                <input type="text" id="login-username" placeholder="اسم المستخدم">
                <input type="password" id="login-password" placeholder="كلمة المرور">
                <button onclick="login()" style="width:100%;">دخول</button>
            </div>
        </div>
        
        <!-- لوحة التحكم -->
        <div id="dashboard-screen" style="display:none;">
            <div class="tabs">
                <div class="tab active" onclick="switchTab(0)">📊 الإحصائيات</div>
                <div class="tab" onclick="switchTab(1)">🍽️ الأصناف</div>
                <div class="tab" onclick="switchTab(2)">🪑 الطاولات</div>
                <div class="tab" onclick="switchTab(3)">📦 الطلبات</div>
                <div class="tab" onclick="switchTab(4)">⚙️ الإعدادات</div>
            </div>
            
            <!-- الإحصائيات -->
            <div class="tab-content active" id="tab-0">
                <div class="dashboard">
                    <div class="stat-card">
                        <h3 id="stat-orders">0</h3>
                        <p>إجمالي الطلبات</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="stat-revenue">0</h3>
                        <p>الإيرادات (ريال)</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="stat-active">0</h3>
                        <p>طلبات نشطة</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="stat-items">0</h3>
                        <p>عدد الأصناف</p>
                    </div>
                </div>
            </div>
            
            <!-- الأصناف -->
            <div class="tab-content" id="tab-1">
                <div class="section">
                    <h2>إضافة صنف جديد</h2>
                    <input type="text" id="new-item-name" placeholder="اسم الصنف">
                    <input type="text" id="new-item-desc" placeholder="الوصف">
                    <input type="number" id="new-item-price" placeholder="السعر (ريال)">
                    <input type="number" id="new-item-time" placeholder="وقت التحضير (دقيقة)">
                    <select id="new-item-category"></select>
                    <button onclick="addMenuItem()" style="width:100%;">إضافة الصنف</button>
                </div>
                <div class="section">
                    <h2>الأصناف الحالية</h2>
                    <div id="admin-menu-items"></div>
                </div>
            </div>
            
            <!-- الطاولات -->
            <div class="tab-content" id="tab-2">
                <div class="section">
                    <h2>إضافة طاولة</h2>
                    <input type="text" id="new-table-number" placeholder="رقم الطاولة">
                    <button onclick="addTable()" style="width:100%;">إضافة</button>
                </div>
                <div class="section">
                    <h2>الطاولات</h2>
                    <div class="table-list" id="tables-list"></div>
                </div>
            </div>
            
            <!-- الطلبات -->
            <div class="tab-content" id="tab-3">
                <div id="admin-orders-list"></div>
            </div>
            
            <!-- الإعدادات -->
            <div class="tab-content" id="tab-4">
                <div class="section">
                    <h2>إعدادات المطعم</h2>
                    <button onclick="logout()" style="width:100%; background:#f44336;">تسجيل الخروج</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const RESTAURANT_ID = 'd9c7b322-9971-43d9-93a0-93b852206aa3';
        let token = localStorage.getItem('adminToken');
        
        if (token) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard-screen').style.display = 'block';
            loadDashboard();
        }
        
        async function login() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            
            const response = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ restaurantId: RESTAURANT_ID, username, password })
            });
            
            const data = await response.json();
            if (data.success) {
                localStorage.setItem('adminToken', 'logged-in');
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'block';
                loadDashboard();
            } else {
                alert('خطأ في تسجيل الدخول');
            }
        }
        
        function logout() {
            localStorage.removeItem('adminToken');
            location.reload();
        }
        
        function switchTab(index) {
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.className = 'tab' + (i === index ? ' active' : '');
            });
            document.querySelectorAll('.tab-content').forEach((c, i) => {
                c.className = 'tab-content' + (i === index ? ' active' : '');
            });
        }
        
        async function loadDashboard() {
            // تحميل الإحصائيات
            const statsResponse = await fetch(`/api/admin/stats/${RESTAURANT_ID}`);
            const statsData = await statsResponse.json();
            
            document.getElementById('stat-orders').textContent = statsData.data.totalOrders;
            document.getElementById('stat-revenue').textContent = statsData.data.totalRevenue;
            document.getElementById('stat-active').textContent = statsData.data.activeOrders;
            document.getElementById('stat-items').textContent = statsData.data.totalItems;
            
            // تحميل الأصناف
            loadCategories();
            loadMenuItems();
            loadTables();
            loadOrders();
        }
        
        async function loadCategories() {
            const response = await fetch(`/api/menu/restaurant/${RESTAURANT_ID}`);
            const data = await response.json();
            
            const select = document.getElementById('new-item-category');
            select.innerHTML = '';
            
            data.data.categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat.id;
                option.textContent = cat.name;
                select.appendChild(option);
            });
        }
        
        async function loadMenuItems() {
            const response = await fetch(`/api/menu/restaurant/${RESTAURANT_ID}`);
            const data = await response.json();
            
            const container = document.getElementById('admin-menu-items');
            container.innerHTML = '';
            
            data.data.categories.forEach(cat => {
                cat.menuItems.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'menu-item-admin';
                    div.innerHTML = `
                        <div>
                            <strong>${item.name}</strong>
                            <div style="color:#888;">${item.price} ريال</div>
                        </div>
                        <button onclick="deleteMenuItem('${item.id}')">حذف</button>
                    `;
                    container.appendChild(div);
                });
            });
        }
        
        async function addMenuItem() {
            const name = document.getElementById('new-item-name').value;
            const desc = document.getElementById('new-item-desc').value;
            const price = document.getElementById('new-item-price').value;
            const time = document.getElementById('new-item-time').value;
            const categoryId = document.getElementById('new-item-category').value;
            
            const response = await fetch('/api/admin/menu-items', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ restaurantId: RESTAURANT_ID, categoryId, name, desc, price, time })
            });
            
            const data = await response.json();
            if (data.success) {
                alert('✅ تم إضافة الصنف');
                document.getElementById('new-item-name').value = '';
                document.getElementById('new-item-desc').value = '';
                document.getElementById('new-item-price').value = '';
                document.getElementById('new-item-time').value = '';
                loadMenuItems();
            }
        }
        
        async function deleteMenuItem(itemId) {
            const response = await fetch(`/api/admin/menu-items/${itemId}`, {
                method: 'DELETE'
            });
            const data = await response.json();
            if (data.success) {
                loadMenuItems();
            }
        }
        
        async function loadTables() {
            const response = await fetch(`/api/admin/tables/${RESTAURANT_ID}`);
            const data = await response.json();
            
            const container = document.getElementById('tables-list');
            container.innerHTML = '';
            
            data.data.forEach(table => {
                const div = document.createElement('div');
                div.className = 'table-card';
                div.innerHTML = `
                    <h4>طاولة ${table.table_number}</h4>
                    <p>QR: ${table.qr_code.substring(0, 10)}...</p>
                `;
                container.appendChild(div);
            });
        }
        
        async function addTable() {
            const tableNumber = document.getElementById('new-table-number').value;
            
            const response = await fetch('/api/admin/tables', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ restaurantId: RESTAURANT_ID, tableNumber })
            });
            
            const data = await response.json();
            if (data.success) {
                alert('✅ تم إضافة الطاولة');
                loadTables();
            }
        }
        
        async function loadOrders() {
            const response = await fetch(`/api/orders/all/${RESTAURANT_ID}`);
            const data = await response.json();
            
            const container = document.getElementById('admin-orders-list');
            container.innerHTML = '';
            
            data.data.forEach(order => {
                const div = document.createElement('div');
                div.className = 'section';
                div.innerHTML = `
                    <h3>طلب #${order.order_number}</h3>
                    <div style="color:#888;">الحالة: ${order.status}</div>
                    <div style="margin-top:10px;">
                        ${order.items.map(i => `<div>${i.quantity} × ${i.item_name}</div>`).join('')}
                    </div>
                    <div style="color:#ff6b35; font-weight:bold; margin-top:10px;">${order.total_amount} ريال</div>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
